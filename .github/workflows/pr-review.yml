name: PR review and auto-merge

# Revisa TODOS los pull requests contra main (los de Dependabot y los del
# autor) con Claude Code y, si el gate técnico pasa y la IA no encuentra
# bloqueantes, aprueba y mergea sin intervención humana.
#
# Dos disparadores para el mismo trabajo, y cada PR usa exactamente uno:
#
# - pull_request         → PRs del autor (ramas del propio repo). Corre en el
#                          contexto del PR y recibe los secretos con normalidad.
# - pull_request_target  → SOLO PRs de Dependabot. GitHub ejecuta los
#                          workflows disparados por Dependabot con un
#                          GITHUB_TOKEN de solo lectura y sin secretos del
#                          repo, así que bajo `pull_request` este workflow
#                          nunca podría revisar (necesita CLAUDE_CODE_OAUTH_TOKEN)
#                          ni aprobar/mergear. `pull_request_target` corre en
#                          el contexto de main, con secretos y token de
#                          escritura.
#
# Por qué es seguro usar pull_request_target aquí:
#   1. Solo se activa cuando el actor es dependabot[bot] y el PR nace en este
#      mismo repo (no forks). Si un humano empuja a una rama dependabot/**, el
#      actor deja de ser Dependabot y el PR pasa por la vía `pull_request`.
#   2. El job `gate` es el único que ejecuta código del PR (npm ci, build...)
#      y lo hace SIN ningún secreto, con GITHUB_TOKEN de solo lectura y sin
#      credenciales persistidas en el checkout. Es exactamente la misma
#      exposición que ya tenía el evento `pull_request` de deploy.yml.
#   3. El job `review`, que sí tiene el token de Claude y permisos de
#      escritura, NUNCA ejecuta código del PR: monta main en la raíz, deja los
#      archivos del PR en un subdirectorio como datos de solo lectura, y
#      Claude solo dispone de herramientas de lectura (Read/Grep/Glob y
#      `gh pr diff` / `gh pr view`).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

# El nombre del evento va en el grupo a propósito: para un PR de Dependabot se
# disparan ambos eventos, y si compartieran grupo la ejecución "vacía" (todos
# los jobs omitidos) cancelaría a la real.
concurrency:
  group: pr-review-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Sin permisos por defecto: cada job declara los suyos.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Genera la imagen de portada (OpenAI) para posts nuevos/editados que no
  # traigan `image` en el frontmatter, y la comitea de vuelta al PR ANTES del
  # gate — así build/validate-articles ya ven el campo `image` presente.
  # Nunca corre en PRs de Dependabot (no tocan contenido) ni de forks (no hay
  # forma de comitear de vuelta sin exponer el secret de OpenAI a un fork).
  # ---------------------------------------------------------------------------
  generate-images:
    name: Generate missing cover images
    if: >-
      github.event_name == 'pull_request'
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Sin OPENAI_API_KEY (ej. un fork o antes de configurar el secret) este
      # paso no debe tumbar el PR: simplemente no genera nada y el post queda
      # sin imagen, como pasaba antes de esta automatización.
      - name: Generate cover images for new/changed posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY no está configurado. Se omite la generación de imágenes."
            exit 0
          fi
          npm run generate:images

      # PR_MERGE_PAT, no GITHUB_TOKEN: un push hecho con el token efímero de
      # Actions no dispara un nuevo evento `synchronize` de forma utilizable
      # (el run queda en "action_required" sin ejecutar ningún job, la misma
      # restricción que documenta el step "Merge PR" más abajo). Con el PAT
      # de una cuenta real, el push sí dispara `synchronize` normalmente y
      # "gate"/"review" corren sobre el commit con la imagen ya incluida.
      - name: Commit generated images
        env:
          GH_TOKEN: ${{ secrets.PR_MERGE_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::El secret PR_MERGE_PAT está vacío o no existe. Sin él el push no dispararía un nuevo synchronize (ver comentario de este step). No se comitea la imagen."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -m "chore: generate cover image with OpenAI"
          git push origin "HEAD:${HEAD_REF}"

  # ---------------------------------------------------------------------------
  # Gate técnico. Si cualquier paso falla, el job queda en rojo y `review` no
  # se ejecuta (needs), así que no hay aprobación ni merge posible.
  # ---------------------------------------------------------------------------
  gate:
    name: Build, lint and check
    needs: generate-images
    # Siempre corre (needs.generate-images.result puede ser 'skipped' en PRs de
    # Dependabot o forks, y eso no debe bloquear el gate). Enrutado de eventos
    # (ver cabecera): bajo pull_request_target exigimos además que el PR sea
    # del propio repo.
    if: >-
      always() &&
      (needs.generate-images.result == 'success' || needs.generate-images.result == 'skipped') &&
      ((github.event_name == 'pull_request' && github.actor != 'dependabot[bot]')
      || (github.event_name == 'pull_request_target'
          && github.actor == 'dependabot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      # El job "generate-images" pudo haber empujado un nuevo commit (la
      # imagen generada). Ese push dispara un nuevo evento `synchronize` que
      # vuelve a correr este mismo workflow desde cero sobre el commit nuevo,
      # así que ESTE run (el que arrancó antes del push) puede quedarse
      # validando un estado ya obsoleto del PR si usa el SHA fijo del evento.
      # Usamos la rama, no el SHA, para que el checkout siempre traiga lo
      # último que hay en el PR en el momento en que este step corre.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run security:audit

      - name: Validate articles
        run: node scripts/validate-articles.js

      - name: Lint
        run: npm run lint

      - name: Type check (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check internal links
        run: node scripts/check-dist-links.mjs dist

  # ---------------------------------------------------------------------------
  # Revisión con IA + aprobación + merge. Solo corre si `gate` terminó en verde.
  # ---------------------------------------------------------------------------
  review:
    name: Claude review and merge
    needs: gate
    # Las PRs de forks pasan el gate como CI normal pero nunca se auto-mergean.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # merge
      pull-requests: write   # approve + comentarios
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # Token por defecto para gh (comentarios, approve). El step "Merge PR"
      # lo SOBREESCRIBE con PR_MERGE_PAT a propósito: un push a main hecho
      # con GITHUB_TOKEN no dispara deploy.yml (ver comentario de ese step).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Dependabot solo toca package.json/package-lock.json/workflows: una
      # revisión bastante más acotada que un PR de código real. Menos turnos
      # ahorra cuota de la suscripción sin perder rigor donde sí hace falta.
      MAX_TURNS: ${{ github.event_name == 'pull_request_target' && '15' || '40' }}

    steps:
      # La action exige un repo git en la raíz. Montamos main (confiable) ahí
      # y NUNCA el head del PR, como pide docs/security.md de la action.
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      # Archivos del PR como datos de solo lectura, para que Claude pueda leer
      # el contexto completo de lo que cambia. No se ejecuta nada de aquí.
      # Misma razón que en "gate" para usar la rama en vez del SHA fijo del
      # evento: "generate-images" pudo haber empujado un commit nuevo.
      - name: Checkout PR head (read-only, subdirectory)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false

      - name: Claude Code review
        id: review
        # v1.0.216 — https://github.com/anthropics/claude-code-action/releases/tag/v1.0.216
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          # Token de suscripción (claude setup-token), no API key de facturación.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Con github_token explícito la action no intenta el intercambio
          # OIDC que requiere tener instalada la GitHub App de Claude.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Sin esto la action rechaza ejecuciones iniciadas por bots.
          allowed_bots: dependabot[bot]
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Eres el revisor automático de este repositorio. Tu veredicto decide
            si el PR se mergea sin intervención humana, así que sé riguroso y
            basa cada hallazgo en evidencia concreta del diff.

            Contexto del proyecto: blog estático con Astro 7 desplegado en
            Cloudflare Pages. `functions/` contiene Pages Functions (API de
            likes/views/stats sobre D1, definida en `schema.sql`) y el
            middleware (`functions/_middleware.ts`) que fija cabeceras de
            seguridad, CSP con nonces por petición y redirecciones de
            artículos renombrados. `wrangler.toml` define bindings de D1 por
            entorno. El build, lint y `astro check` YA pasaron en un job
            anterior; no repitas esas comprobaciones.

            Cómo trabajar:
            - Obtén el diff con `gh pr diff ${{ github.event.pull_request.number }}`
              y los metadatos con `gh pr view ${{ github.event.pull_request.number }}`.
            - El directorio actual es la rama base (main). Los archivos tal
              como quedan en el PR están en `pr-head/`; léelos para entender
              el contexto completo de cada cambio.
            - No tienes permisos de escritura ni debes intentar comentar en el
              PR: el workflow publicará tu veredicto.

            Revisa ÚNICAMENTE:
            1. Bugs reales: lógica incorrecta, errores en tiempo de ejecución,
               casos límite rotos, condiciones de carrera.
            2. Vulnerabilidades de seguridad: inyección (SQL en D1, cabeceras,
               HTML/XSS), secrets o tokens hardcodeados, validación de input
               insuficiente en las Cloudflare Functions, debilitamiento de la
               CSP o de las cabeceras de seguridad, exposición de datos.
            3. Regresiones funcionales: comportamiento existente que deja de
               funcionar, rutas o redirecciones rotas, breaking changes no
               intencionales en la API o en los bindings de wrangler.toml.

            En PRs de Dependabot (solo package.json / package-lock.json /
            workflows): comprueba que el lockfile es coherente con el manifest,
            que las versiones nuevas de las GitHub Actions fijadas por SHA
            corresponden al tag que indica el comentario, y busca en `pr-head/`
            usos de APIs que la nueva versión mayor haya eliminado. Un salto de
            versión mayor NO es bloqueante por sí mismo si el build pasó; solo
            lo es si encuentras evidencia concreta de incompatibilidad.

            Si el PR añade o edita un artículo en `src/content/blog/**/*.md`
            (o `.mdx`): lee el contenido completo en `pr-head/` y marca como
            "warning" errores ortográficos u gramaticales evidentes en el
            idioma del artículo (`lang` en el frontmatter). Marca como
            "blocking" solo si un error de contenido es lo bastante grave como
            para publicar información técnica incorrecta (un comando
            equivocado, una versión de API que no existe, una afirmación
            falsa) — nunca por estilo de escritura o preferencia de redacción.

            NO comentes sobre estilo, formato, nombres, preferencias
            subjetivas, refactors opcionales ni rendimiento hipotético.

            Clasificación:
            - "blocking": bug real, vulnerabilidad o breaking change no
              intencional con alta confianza. Un solo hallazgo blocking implica
              verdict = "block".
            - "warning": algo que merece mención pero no impide el merge.
            - Si no hay hallazgos blocking, verdict = "approve".

            Devuelve el resultado estructurado según el esquema JSON indicado.
            En `summary` escribe 1-3 frases en español. En cada hallazgo
            indica archivo (y línea si aplica) y una explicación concreta.
          # Modelo y esfuerzo fijados a propósito: revisar un diff acotado
          # contra un JSON schema fijo no necesita el razonamiento de Opus ni
          # el esfuerzo "high", y esta acción consume de la misma cuota
          # semanal de la suscripción que el uso normal de Claude Code.
          claude_args: >-
            --model sonnet
            --effort medium
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --add-dir pr-head
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","block"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["blocking","warning"]},"file":{"type":"string"},"description":{"type":"string"}},"required":["severity","file","description"]}}},"required":["verdict","summary","findings"]}'

      # El veredicto llega por variable de entorno, nunca interpolado en el
      # script: su contenido lo generó la IA a partir del PR y no es confiable
      # como código shell.
      - name: Evaluate verdict
        id: verdict
        env:
          VERDICT_JSON: ${{ steps.review.outputs.structured_output }}
          CLAUDE_CONCLUSION: ${{ steps.review.outputs.conclusion }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Fail-closed: sin veredicto válido no hay aprobación.
          if [ "$CLAUDE_CONCLUSION" != "success" ] || [ -z "$VERDICT_JSON" ] \
             || ! echo "$VERDICT_JSON" | jq -e '.verdict' >/dev/null 2>&1; then
            echo "::error::La revisión de Claude no produjo un veredicto válido (conclusion=$CLAUDE_CONCLUSION)."
            exit 1
          fi

          verdict=$(echo "$VERDICT_JSON" | jq -r '.verdict')
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

          {
            echo "## Revisión automática (Claude Code)"
            echo ""
            echo "**Veredicto:** \`$verdict\`"
            echo ""
            echo "$VERDICT_JSON" | jq -r '.summary'
            echo ""
            if [ "$(echo "$VERDICT_JSON" | jq '.findings | length')" -gt 0 ]; then
              echo "### Hallazgos"
              echo ""
              echo "$VERDICT_JSON" | jq -r '.findings[] | "- **\(.severity)** · \(.file) — \(.description)"'
              echo ""
            fi
            echo "<sub>Gate: build, lint, astro check, audit y enlaces en verde. Ejecución: $RUN_URL</sub>"
          } > verdict.md

          cat verdict.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$verdict" != "approve" ]; then
            # Bloqueante con veredicto VÁLIDO (a diferencia del fail-closed de
            # arriba, que es un fallo técnico sin hallazgos reales). Guardamos
            # el JSON crudo como artifact para que "autofix" lo consuma sin
            # tener que re-parsear comentarios del PR.
            echo "$VERDICT_JSON" > findings.json
            gh pr comment "$PR_NUMBER" --body-file verdict.md
            echo "::error::Claude encontró hallazgos bloqueantes. El PR requiere revisión humana."
            exit 1
          fi

      - name: Upload findings for autofix
        # Corre siempre que el step anterior haya llegado a escribir
        # findings.json (bloqueo con veredicto VÁLIDO), incluso si ese mismo
        # step terminó en `exit 1`. hashFiles no falla si el archivo no
        # existe: en el camino feliz (approve) o en el fail-closed técnico
        # (sin JSON válido) simplemente no sube nada.
        if: always() && hashFiles('findings.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocking-findings
          path: findings.json
          retention-days: 1

      # Requiere en Settings → Actions → General: "Allow GitHub Actions to
      # create and approve pull requests". Si no está activo, este paso falla
      # y el PR no se mergea.
      - name: Approve PR
        if: steps.verdict.outputs.verdict == 'approve'
        run: |
          set -euo pipefail
          gh pr review "$PR_NUMBER" --approve --body-file verdict.md || {
            echo "::error::No se pudo aprobar el PR. Revisa que 'Allow GitHub Actions to create and approve pull requests' esté habilitado en Settings → Actions → General."
            exit 1
          }

      # Squash: el historial de main es lineal, sin merge commits. Merge
      # directo (no --auto): el repo no tiene auto-merge habilitado. Este
      # mismo job NO puede ser un status check requerido por la protección de
      # main: mientras corre está "in progress", así que branch protection
      # bloquearía su propio intento de merge en un ciclo irresoluble — por
      # eso solo "Build, lint and check" está en la lista de checks
      # requeridos; el veredicto de Claude ya gatea el merge más arriba
      # (steps.verdict.outputs.verdict == 'approve'), sin depender de que
      # GitHub lo reconozca como check formal.
      #
      # ESTE STEP USA PR_MERGE_PAT, NO GITHUB_TOKEN — y es lo que hace que el
      # push resultante a main dispare deploy.yml a producción. Causa raíz:
      # GitHub, de forma intencional y documentada, NUNCA dispara workflows
      # `on: push` / `on: pull_request` a partir de un push hecho con el
      # GITHUB_TOKEN efímero de otro workflow (evita loops recursivos entre
      # workflows). Con GITHUB_TOKEN el merge "funciona" — el PR se cierra y
      # el código llega a main — pero deploy.yml no corre y producción queda
      # desactualizada SIN ningún error visible. Se comprobó en producción:
      # ~10 merges automáticos en un día y ni un solo run de "Deploy to
      # Cloudflare Pages" sobre main. Un PAT vinculado a una cuenta de usuario
      # real no tiene esa restricción, así que el push sí dispara deploy.yml.
      #
      # PR_MERGE_PAT: fine-grained PAT del dueño, limitado a este repo, con
      # Contents: read/write y Pull requests: read/write, sin expiración.
      # Riesgo conocido: si se revoca, expira o alguien lo "simplifica" de
      # vuelta a GITHUB_TOKEN, el síntoma es el mismo que se arregló aquí —
      # merges en verde y producción congelada, sin fallo en ningún run.
      # Si el secret está vacío, `gh` falla con error de autenticación y el
      # PR queda sin mergear (mejor eso que un merge silencioso sin deploy).
      #
      # El PAT se limita a ESTE step: "Approve PR" y los comentarios siguen
      # con GITHUB_TOKEN, que para eso funciona bien (comprobado en
      # producción) y no necesita disparar nada.
      - name: Merge PR
        if: steps.verdict.outputs.verdict == 'approve'
        env:
          GH_TOKEN: ${{ secrets.PR_MERGE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::El secret PR_MERGE_PAT está vacío o no existe. Sin él el merge no dispararía deploy.yml (ver comentario de este step). No se mergea."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --squash --delete-branch

  # ---------------------------------------------------------------------------
  # Auto-fix. Se dispara cada vez que `review` termina en failure (bloqueo
  # real O fallo técnico), pero el propio job descarta la corrida temprano si
  # no encuentra el artifact `blocking-findings` — así solo actúa cuando hay
  # un veredicto "block" válido con hallazgos concretos que corregir.
  # Un único intento por PR: si ya existe un commit de autofix en el historial,
  # no se reintenta — evita un loop de reescrituras si el primer intento no
  # resuelve bien el problema, y deja el PR para revisión humana.
  # ---------------------------------------------------------------------------
  autofix:
    name: Claude auto-fix
    needs: [gate, review]
    if: >-
      always() && needs.review.result == 'failure'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      # Si "review" falló por un motivo que no sea un veredicto "block"
      # válido (fallo técnico de la acción, timeout, error de red...), el job
      # "review" nunca subió este artifact — continue-on-error evita que la
      # ausencia del artifact tumbe este job entero, y el step siguiente
      # decide en base a si la descarga realmente trajo algo.
      - name: Download blocking findings
        id: precheck
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blocking-findings

      # Evita gastar un intento de autofix en un problema técnico que un
      # simple reintento manual del job "review" podría resolver solo.
      - name: Check download succeeded
        id: has_findings
        run: |
          if [ "${{ steps.precheck.outcome }}" != "success" ] || [ ! -f findings.json ]; then
            echo "::notice::No hay findings.json (probablemente un fallo técnico de la revisión, no un hallazgo real). No se intenta autofix."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      # actions/checkout borra el contenido del directorio de destino en su
      # primer checkout de la sesión (siempre, exista o no ya un repo git
      # ahí) — findings.json debe salir del árbol de trabajo ANTES del
      # siguiente checkout, o desaparece.
      - name: Move findings out of the workspace
        if: steps.has_findings.outputs.should_run == 'true'
        run: mv findings.json /tmp/findings.json

      # Único intento: si ya hay un commit de autofix en la rama, nos
      # rendimos y dejamos el PR para revisión humana. --repo explícito: sin
      # un checkout todavía no hay `.git` local del que `gh` pueda inferir
      # el repositorio.
      - name: Check retry budget
        id: budget
        if: steps.has_findings.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          already_tried=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json commits \
            --jq '[.commits[] | select(.messageHeadline | startswith("autofix:"))] | length')
          if [ "$already_tried" -gt 0 ]; then
            echo "::warning::Ya se intentó un autofix en este PR. No se reintenta; requiere revisión humana."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR branch
        if: steps.has_findings.outputs.should_run == 'true' && steps.budget.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          # Sí persistimos credenciales aquí: este job necesita hacer push
          # del fix de vuelta a la rama del PR.

      - name: Setup Node.js
        if: steps.has_findings.outputs.should_run == 'true' && steps.budget.outputs.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'npm'

      # Instalado por adelantado, no dejado para que Claude lo corra: así
      # "npm ci" no necesita estar en --allowedTools (evita que reescriba
      # package-lock.json por accidente al correrlo con otros flags).
      - name: Install dependencies
        if: steps.has_findings.outputs.should_run == 'true' && steps.budget.outputs.should_run == 'true'
        run: npm ci

      # A diferencia del job "review" (solo lectura), este sí necesita
      # escribir código: le damos Edit/Write acotado al propio checkout y
      # permiso de ejecutar el mismo gate técnico para autoverificarse antes
      # de hacer push, pero SIN permisos de git/gh (el push lo hace el
      # workflow, no Claude, para no darle un token de escritura directo).
      - name: Claude auto-fix
        id: fix
        if: steps.has_findings.outputs.should_run == 'true' && steps.budget.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: dependabot[bot]
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            La revisión automática de este PR encontró hallazgos bloqueantes.
            Lee el archivo `/tmp/findings.json` (JSON con "verdict", "summary"
            y "findings": un array de {severity, file, description}) y
            corrige ÚNICAMENTE los hallazgos con severity "blocking", con el
            cambio más pequeño y directo posible — nunca refactors, nunca
            cambios de estilo, nunca tocar código que el hallazgo no menciona.

            Reglas:
            - Edita solo los archivos que los hallazgos señalan.
            - Después de cada cambio corre \`npm run build\`, \`npm run lint\`
              y \`npm run check\` para confirmar que sigue compilando.
            - Si un hallazgo no tiene una corrección clara y segura (por
              ejemplo, requiere una decisión de producto o arquitectura), NO
              inventes una solución: deja ese hallazgo sin tocar y repórtalo
              en el resumen final para que quede para revisión humana.
            - No toques configuración de seguridad (CSP, permisos de
              functions/, wrangler.toml) salvo que el hallazgo bloqueante sea
              exactamente sobre eso.

            Al terminar, resume en 1-2 frases qué arreglaste y si algún
            hallazgo quedó sin resolver.
          claude_args: >-
            --model sonnet
            --effort medium
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(npm run build),Bash(npm run lint),Bash(npm run check)"

      - name: Commit and push fix
        if: steps.has_findings.outputs.should_run == 'true' && steps.budget.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "::warning::Claude no hizo ningún cambio. Requiere revisión humana."
            gh pr comment "$PR_NUMBER" --body "El intento de autofix no produjo cambios — el hallazgo bloqueante requiere revisión humana."
            exit 0
          fi

          git add -A
          git commit -m "autofix: address blocking findings from automated review"
          git push origin "HEAD:${HEAD_REF}"

          gh pr comment "$PR_NUMBER" --body "Se intentó un autofix automático para los hallazgos bloqueantes de arriba. El gate y la revisión van a correr de nuevo sobre este nuevo commit."
