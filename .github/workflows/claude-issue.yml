name: Claude implement from issue

# Menciona a @claude en un Issue (o en un comentario de un Issue) para que
# implemente lo que describís. Claude NUNCA abre el PR por su cuenta — empuja
# los commits a una rama y deja un comentario con un link de "Create pull
# request" prellenado, para que el clic de abrir el PR sea siempre tuyo. Una
# vez que ese PR exista, entra al mismo pipeline de pr-review.yml (gate +
# revisión + auto-merge) que ya corre sobre cualquier otro PR del repo.
#
# Sin la GitHub App oficial de Claude instalada: usamos github_token (igual
# que pr-review.yml) en vez de OIDC, así los comentarios de Claude aparecen
# bajo la identidad del propio workflow en vez de "claude[bot]".
#
# La rama de trabajo (claude/issue-N) la crea el workflow ANTES de invocar a
# Claude, y --allowedTools solo permite git push a ese nombre exacto — nunca
# un comodín tipo "git push:*", que también dejaría empujar a main. Esto es
# defensa en profundidad: aunque el contenido del Issue intente instruir a
# Claude para que empuje a otro lugar (inyección de prompt), la tool para
# hacerlo no existe en este job.

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude:
    name: Claude implement
    # Solo Issues (no comentarios de PR, que ya cubre pr-review.yml). Exige
    # DOS condiciones de confianza, no solo una: quien escribe "@claude" debe
    # ser el dueño del repo, Y el propio Issue debe haberlo abierto el dueño.
    # Sin la segunda condición, cualquiera podría abrir un Issue público con
    # instrucciones maliciosas ocultas en el cuerpo — ese texto se pasa
    # literalmente al prompt de Claude más abajo — y bastaría con que el
    # dueño comentara "@claude" (sin releer el cuerpo completo) para que se
    # ejecuten con permisos de escritura reales sobre el repo. Este repo no
    # tiene colaboradores además del dueño; si en el futuro los hay, cambiar
    # ambas comparaciones por una lista explícita de usuarios de confianza.
    if: >-
      github.actor == github.event.repository.owner.login
      && github.event.issue.user.login == github.event.repository.owner.login
      && (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
        || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
            && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Nombre de rama determinístico calculado por el workflow, no dejado a
      # elección de Claude — así --allowedTools puede restringir el checkout
      # y el push a esta única rama por nombre exacto, en vez de un
      # comodín "git push:*" que también permitiría empujar a main.
      BRANCH_NAME: claude/issue-${{ github.event.issue.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trae también refs remotas ya existentes, para el caso de un
          # segundo "@claude" en el mismo Issue (ver step siguiente).
          fetch-depth: 0

      # Requerido antes de cualquier "git commit": un runner ubuntu-latest
      # limpio no trae identidad configurada, y sin esto Claude no podría
      # arreglarlo por su cuenta ("git config" no está en --allowedTools).
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Si ya existe la rama remota (un "@claude" posterior en el mismo
      # Issue, iterando sobre un intento previo), seguimos sobre ella en vez
      # de recrearla desde main — evita un push rechazado por non-fast-forward.
      - name: Create or resume branch for Claude to work on
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" > /dev/null; then
            git checkout -b "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME"
          fi

      - name: Claude Code
        id: claude
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Sin trigger_phrase custom: reacciona al "@claude" por defecto,
          # tanto en el cuerpo del Issue como en comentarios posteriores.
          prompt: |
            Contexto del proyecto: blog estático con Astro 7 desplegado en
            Cloudflare Pages. `functions/` contiene Pages Functions (API de
            likes/views/stats sobre D1, definida en `schema.sql`) y el
            middleware (`functions/_middleware.ts`) que fija cabeceras de
            seguridad, CSP con nonces por petición y redirecciones de
            artículos renombrados. `wrangler.toml` define bindings de D1 por
            entorno.

            Ya estás en la rama "${{ env.BRANCH_NAME }}" (creada por el
            workflow antes de invocarte). Implementa lo que se describe en
            este Issue (título, cuerpo y comentarios). Reglas:
            - Antes de escribir código, si la petición es ambigua o se puede
              resolver de más de una forma razonable, comenta en el Issue
              explicando la ambigüedad y las opciones, y detente ahí —no
              adivines una decisión de producto o arquitectura importante.
            - Sigue las convenciones ya existentes en el repo (Tailwind,
              componentes Astro, i18n en src/i18n/, helpers en src/lib/) en
              vez de introducir patrones nuevos.
            - Después de cada cambio corre `npm run build`, `npm run lint` y
              `npm run check`; no dejes el repo en un estado que no compile.
            - No toques `.github/workflows/**` (Claude no tiene permisos de
              escritura sobre workflows de todos modos) ni la configuración
              de seguridad (CSP, permisos de `functions/`, `wrangler.toml`)
              salvo que el Issue lo pida explícitamente.
            - No hagas commit de secrets, tokens ni credenciales.
            - Cuando termines, ejecuta estos tres comandos como invocaciones
              de Bash SEPARADAS (no los encadenes con && en una sola línea,
              cada patrón de --allowedTools solo matchea el comando exacto,
              no una cadena compuesta):
              1. `git add -A`
              2. `git commit -m "tu mensaje aquí"`
              3. `git push -u origin ${{ env.BRANCH_NAME }}`
          claude_args: >-
            --model sonnet
            --effort medium
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(npm run build),Bash(npm run lint),Bash(npm run check),Bash(npm ci),Bash(git status),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin ${{ env.BRANCH_NAME }}),Bash(git push origin ${{ env.BRANCH_NAME }})"
