version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Lima
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      cloudflare:
        patterns:
          - wrangler
          - "@cloudflare/*"
      development-tooling:
        dependency-type: development
        patterns:
          - "*"

  # Las acciones del workflow van fijadas por SHA, así que sin esto se quedan
  # congeladas y sin recibir parches de seguridad.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
